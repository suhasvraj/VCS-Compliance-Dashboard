function renderDeadlineTimeline(items) {
  if (!items || !items.length) {
    return `<div class="p-6 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-center text-xs font-bold text-slate-400">
      No deadlines found
    </div>`;
  }

  return `
    <div class="space-y-4">
      ${items.map(d => {
        const statusColor = d.status === "Overdue" ? "bg-red-600" : d.status === "Upcoming" ? "bg-amber-500" : "bg-green-600";
        const badgeColor = d.status === "Overdue" ? "text-red-600 bg-red-50 dark:bg-red-900/20 border-red-100 dark:border-red-800" :
                           d.status === "Upcoming" ? "text-amber-700 bg-amber-50 dark:bg-amber-900/20 border-amber-100 dark:border-amber-800" :
                           "text-green-700 bg-green-50 dark:bg-green-900/20 border-green-100 dark:border-green-800";

        return `
          <div class="flex gap-4">
            <div class="flex flex-col items-center">
              <div class="timeline-dot ${statusColor} shadow"></div>
              <div class="timeline-line"></div>
            </div>

            <div class="flex-1 p-5 rounded-2xl bg-white/80 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 shadow-sm glass-pop">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <p class="text-sm font-extrabold text-slate-900 dark:text-white">${d.title}</p>
                  <p class="text-xs font-bold text-slate-500 mt-1">${d.client}</p>
                  <p class="text-[11px] font-bold text-slate-400 mt-2">Due: ${d.due}</p>
                </div>
                <span class="px-3 py-1 rounded-full text-[11px] font-extrabold border ${badgeColor}">
                  ${d.status}
                </span>
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

</script>

/* =========================
   LIQUID GLASS EFFECT (UPGRADED)
========================= */
.liquid-glass{
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.liquid-glass::before{
  content:"";
  position:absolute;
  inset:-2px;
  background: radial-gradient(circle at 20% 10%, rgba(59,130,246,0.35), transparent 60%),
              radial-gradient(circle at 80% 30%, rgba(34,197,94,0.28), transparent 55%),
              radial-gradient(circle at 40% 90%, rgba(168,85,247,0.22), transparent 60%);
  filter: blur(18px);
  opacity: 0.9;
  z-index: 0;
  animation: floatGlow 8s ease-in-out infinite alternate;
}
.liquid-glass::after{
  content:"";
  position:absolute;
  inset:0;
  background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.10));
  mix-blend-mode: overlay;
  opacity: 0.55;
  z-index: 0;
}
.dark .liquid-glass::after{
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  opacity: 0.35;
}

@keyframes floatGlow{
  0%{ transform: translate3d(-10px,-6px,0) scale(1.02); }
  50%{ transform: translate3d(12px,8px,0) scale(1.04); }
  100%{ transform: translate3d(-6px,10px,0) scale(1.02); }
}

/* Smooth hover */
.micro-bounce{ transition: transform .25s ease, box-shadow .25s ease; }
.micro-bounce:hover{ transform: translateY(-2px) scale(1.01); box-shadow: 0 18px 45px rgba(0,0,0,0.12); }

/* Subtle shimmer for cards */
.shimmer{
  position: relative;

}
.shimmer::before{
  content:"";
  position:absolute;
  inset:0;
  transform: translateX(-120%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  animation: shimmerMove 2.8s ease-in-out infinite;
  z-index:0;
}
.dark .shimmer::before{
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
}
@keyframes shimmerMove{
  0%{ transform: translateX(-120%); }
  60%{ transform: translateX(120%); }
  100%{ transform: translateX(120%); }
}

<script>
function toggleMobileSidebar(forceClose=false){
  const sb = document.getElementById("sidebar");
  const bd = document.getElementById("mobileSidebarBackdrop");
  if(!sb || !bd) return;

  if(forceClose){
    sb.classList.remove("mobile-open");

  else bd.classList.add("hidden");
}


/* =========================
   UTILITIES
========================= */
const DATA_VERSION = "vcs_final_system_complete_v1";

function $(id) { return document.getElementById(id); }

function loadData(key, fallback) {
  const stored = localStorage.getItem(key);
  try { return stored ? JSON.parse(stored) : fallback; }
  catch { return fallback; }
}

function saveData(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}


function renderPage(html) {
  const el = $("main-content");
  el.classList.remove("fade-in");
  void el.offsetWidth;
  el.innerHTML = `<div class="fade-in">${html}</div>`;
}
function showToast(msg) {
  const toast = $("toast");
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1600);
}

function renderIcons() {
  try { lucide.createIcons(); } catch(e){}
}

function toggleTheme() {
  document.documentElement.classList.toggle("dark");
  saveData("vcs_theme", document.documentElement.classList.contains("dark"));
}

function loadTheme() {
  const dark = loadData("vcs_theme", false);
  if (dark) document.documentElement.classList.add("dark");
}

function getMonthOptions() {
  return [
    { val: "01", label: "January" },
    { val: "02", label: "February" },
    { val: "03", label: "March" },
    { val: "04", label: "April" },
    { val: "05", label: "May" },
    { val: "06", label: "June" },
    { val: "07", label: "July" },
    { val: "08", label: "August" },
    { val: "09", label: "September" },
    { val: "10", label: "October" },
    { val: "11", label: "November" },
    { val: "12", label: "December" }
  ];
}

function getYearOptions() {
  const years = [];
  const current = new Date().getFullYear();
  for (let y = current - 2; y <= current + 8; y++) years.push(y.toString());
  return years;
}

function getCurrentMonth() {
  return (new Date().getMonth() + 1).toString().padStart(2, "0");
}

function getCurrentYear() {
  return new Date().getFullYear().toString();
}

function getQuarterFromMonth(month) {
  const m = parseInt(month);
  if (m >= 1 && m <= 3) return "Q1";
  if (m >= 4 && m <= 6) return "Q2";
  if (m >= 7 && m <= 9) return "Q3";
  return "Q4";
}

function getHalfFromMonth(month) {
  const m = parseInt(month);
  return m <= 6 ? "H1" : "H2";
}


/* =========================
   FINANCIAL YEAR HELPERS (APR-MAR)
   FY Quarter System:
   Q1: Apr-Jun, Q2: Jul-Sep, Q3: Oct-Dec, Q4: Jan-Mar
   Half Year:
   H1: Apr-Sep, H2: Oct-Mar
========================= */
function getFinancialYearFromMonthYear(month, year) {
  const m = parseInt(month, 10);
  const y = parseInt(year, 10);
  if (m >= 4) return { start: y, end: y + 1 };
  return { start: y - 1, end: y };
}

function getFinancialYearLabel(month, year) {
  const fy = getFinancialYearFromMonthYear(month, year);
  const end2 = String(fy.end).slice(-2);
  return `FY${fy.start}-${end2}`;
}

function getFYQuarterFromMonth(month) {
  const m = parseInt(month, 10);
  if (m >= 4 && m <= 6) return "Q1";
  if (m >= 7 && m <= 9) return "Q2";
  if (m >= 10 && m <= 12) return "Q3";
  return "Q4";
}

function getFYSemiFromMonth(month) {
  const m = parseInt(month, 10);
  if (m >= 4 && m <= 9) return "H1";
  return "H2";
}

function makePeriodKey() {
  const year = App.state.filterYear;
  const month = App.state.filterMonth;

  if (App.state.returnType === "monthly") return `${month}-${year}`;

  if (App.state.returnType === "quarterly") {
    return `${getFYQuarterFromMonth(month)}-${getFinancialYearLabel(month, year)}`;
  }

  if (App.state.returnType === "halfYearly") {
    return `${getFYSemiFromMonth(month)}-${getFinancialYearLabel(month, year)}`;
  }

  if (App.state.returnType === "annual") {
    return `${getFinancialYearLabel(month, year)}`;
  }

  return `${month}-${year}`;
}

/* =========================
   CLIENT DEADLINES + ANALYTICS (FILTER AWARE)
========================= */

function getClientDeadlines(client) {
  const year = parseInt(App.state.filterYear);
  const month = parseInt(App.state.filterMonth);

  if (typeof buildDeadlinesForMonth !== "function") {
    return [
      { title: "PF Payment", date: "15th", type: "Monthly", clientId: client.id },
      { title: "ESI Filing", date: "15th", type: "Monthly", clientId: client.id },
      { title: "PT Filing", date: "20th", type: "Monthly", clientId: client.id }
    ];
  }

  const all = buildDeadlinesForMonth(year, month);
  return all.filter(d => d.clientId === client.id);
}

function calcClientCompletion(client) {
  const data = App.db.compliance[client.type];
  const required = [];

  required.push(...data.registers.map(x => ({ name: x })));
  required.push(...data.notices.map(x => ({ name: x })));
  required.push(...data.onboarding.map(x => ({ name: x })));
  required.push(...data.vcs_activities.map(x => ({ name: x })));

  if (App.state.returnType === "monthly") required.push(...data.returns.monthly.map(x => ({ name: x })));
  if (App.state.returnType === "quarterly") required.push(...data.returns.quarterly.map(x => ({ name: x })));
  if (App.state.returnType === "halfYearly") required.push(...data.returns.halfYearly.map(x => ({ name: x })));
  if (App.state.returnType === "annual") required.push(...data.returns.annual.map(x => ({ name: x })));

  const uploads = (App.db.uploads && App.db.uploads[client.id]) ? App.db.uploads[client.id] : {};

  let done = 0;
  required.forEach(item => {
    const key = makeDocKey(item.name);
    const rec = uploads[key];
    if (rec && rec.status === "Uploaded") done++;
  });

  const total = required.length || 1;
  const percent = Math.round((done / total) * 100);

  return { done, total, percent };
}

function renderClientDeadlinesBox(client) {
  const list = getClientDeadlines(client);

  return `
    <div class="chart-box border border-blue-200 dark:border-blue-800 bg-blue-50/80 dark:bg-blue-900/20">
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h3 class="font-extrabold text-lg text-slate-900 dark:text-white flex items-center gap-2">
            <i data-lucide="bell" class="w-5 h-5 text-blue-700 dark:text-blue-300"></i>
            Upcoming Deadlines
          </h3>
          <p class="text-xs text-slate-600 dark:text-slate-300 font-medium mt-1">
            Filter: <b>${makePeriodKey()}</b>
          </p>
        </div>

        <button onclick="renderCalendarPage()" class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2 rounded-xl shadow-lg">
          Calendar
        </button>
      </div>

      <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        ${(list && list.length) ? list.slice(0, 6).map(d => `
          <div class="p-4 rounded-2xl bg-white/80 dark:bg-slate-900/40 border border-blue-100 dark:border-blue-900">
            <p class="text-xs font-bold text-blue-700 dark:text-blue-300 uppercase">${d.type}</p>
            <p class="text-sm font-extrabold mt-2 text-slate-900 dark:text-white">${d.title}</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 font-bold mt-1">${d.date}</p>
          </div>
        `).join("") : `
          <div class="p-6 rounded-2xl bg-white/70 dark:bg-slate-900/40 border border-blue-100 dark:border-blue-900 text-center">
            <p class="text-xs font-bold text-slate-500">No deadlines for this filter</p>
          </div>
        `}
      </div>
    </div>
  `;
}

function renderClientAnalyticsBox(client) {
  const c = calcClientCompletion(client);

  return `
    <div class="chart-box">
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h3 class="font-extrabold text-lg text-slate-900 dark:text-white flex items-center gap-2">
            <i data-lucide="bar-chart-3" class="w-5 h-5 text-blue-600"></i>
            Analytics
          </h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mt-1">
            Based on your uploads for <b>${makePeriodKey()}</b>
          </p>
        </div>

function makeDocKey(docName) {
  return `${docName} | ${makePeriodKey()}`;
}

function formatDocLabel(docName) {
  return `${docName} (${makePeriodKey()})`;
}

function parseDocKey(docKey) {
  if (!docKey.includes("|")) return { name: docKey, period: "" };
  const parts = docKey.split("|").map(x => x.trim());
  return { name: parts[0], period: parts[1] || "" };
}

/* =========================
   STAFF ANALYTICS (GRAPHICAL)
========================= */


function renderStaffAnalytics() {
  const pool = getStaffClientsPool();

  const avgHealth = pool.length
    ? Math.round(pool.reduce((sum, c) => sum + c.health, 0) / pool.length)
    : 0;

  const factories = pool.filter(c => c.type === "factory").length;
  const shops = pool.filter(c => c.type === "shop").length;

  const completed = pool.filter(c => c.health === 100).length;
  const pending = pool.filter(c => c.health < 70).length;

  const maxHealth = pool.length ? Math.max(...pool.map(c => c.health)) : 0;
  const minHealth = pool.length ? Math.min(...pool.map(c => c.health)) : 0;

  // Demo monthly compliance health curve (fake but realistic)
  const months = ["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
  const base = Math.max(40, avgHealth - 18);
  const series = months.map((_,i)=> Math.min(100, Math.max(30, base + Math.round(Math.sin(i/2)*8) + i)));

  // Task stats
  const myTasks = App.db.tasks.filter(t => {
    if (App.state.staffName === "Vishaal") return true;
    return t.assignedTo === App.state.staffName;
  });
  const doneTasks = myTasks.filter(t => t.status === "Done").length;
  const pendingTasks = myTasks.filter(t => t.status !== "Done").length;

  // Upload stats
  let uploadedCount = 0;
  let pendingUploads = 0;

  pool.forEach(c => {
    const store = App.db.uploads[c.id] || {};
    Object.keys(store).forEach(k => {
      if (store[k]?.fileName) uploadedCount++;
      else pendingUploads++;
    });
  });

  // fallback demo if empty
  if (uploadedCount === 0 && pendingUploads === 0) {
    uploadedCount = Math.max(2, Math.round(pool.length * 2));
    pendingUploads = Math.max(3, Math.round(pool.length * 3));
  }

  renderPage(`
    <div class="max-w-[1500px] mx-auto space-y-8 pb-12">

        <div class="chart-box micro-bounce liquid-glass shimmer">

           <p class="text-5xl font-extrabold text-green-600 mt-3 relative z-10">${completed}</p>
        </div>
        <div class="chart-box micro-bounce liquid-glass shimmer">
           <p class="text-xs font-bold text-slate-500 uppercase tracking-widest relative z-10">Pending</p>
           <p class="text-5xl font-extrabold text-red-600 mt-3 relative z-10">${pending}</p>
        </div>
        <div class="chart-box micro-bounce liquid-glass shimmer">
           <p class="text-xs font-bold text-slate-500 uppercase tracking-widest relative z-10">Total Clients</p>
           <p class="text-5xl font-extrabold text-slate-800 dark:text-white mt-3 relative z-10">${pool.length}</p>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-6">

        <div class="chart-box micro-bounce liquid-glass col-span-2">
          <h3 class="font-extrabold text-lg mb-4 flex items-center gap-2 relative z-10">
            <i data-lucide="activity" class="w-5 h-5 text-blue-600"></i>
            Compliance Health Trend (Demo)
          </h3>
          <div class="relative z-10">
            <canvas id="healthTrendChart" class="chart-canvas"></canvas>
          </div>
        </div>

        <div class="chart-box micro-bounce liquid-glass">
          <h3 class="font-extrabold text-lg mb-4 flex items-center gap-2 relative z-10">
            <i data-lucide="pie-chart" class="w-5 h-5 text-blue-600"></i>
            Client Split
          </h3>
          <div class="relative z-10">
            <canvas id="clientSplitChart" class="chart-canvas"></canvas>
          </div>
        </div>

      </div>

      <div class="grid grid-cols-3 gap-6">

        <div class="chart-box micro-bounce liquid-glass">
          <h3 class="font-extrabold text-lg mb-4 flex items-center gap-2 relative z-10">
            <i data-lucide="upload-cloud" class="w-5 h-5 text-blue-600"></i>
            Upload Status
          </h3>
          <div class="relative z-10">
            <canvas id="uploadStatusChart" class="chart-canvas"></canvas>
          </div>
          <div class="mt-4 text-xs font-bold text-slate-500 relative z-10">
            Uploaded: <span class="text-green-600">${uploadedCount}</span> • Pending: <span class="text-red-600">${pendingUploads}</span>
          </div>
        </div>

        <div class="chart-box micro-bounce liquid-glass">
          <h3 class="font-extrabold text-lg mb-4 flex items-center gap-2 relative z-10">
            <i data-lucide="check-square" class="w-5 h-5 text-blue-600"></i>

          </div>
          <div class="mt-4 text-xs font-bold text-slate-500 relative z-10">
            Done: <span class="text-green-600">${doneTasks}</span> • Pending: <span class="text-red-600">${pendingTasks}</span>
          </div>
        </div>

        <div class="chart-box micro-bounce liquid-glass">
          <h3 class="font-extrabold text-lg mb-4 flex items-center gap-2 relative z-10">
            <i data-lucide="shield-check" class="w-5 h-5 text-blue-600"></i>
            Health Range
          </h3>

          <div class="space-y-4 relative z-10">

            </div>
          </div>

  `);

  renderIcons();

  // CHARTS INIT
  if (typeof Chart !== "undefined") {
    const commonOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { font: { weight: "bold" } } }
      }
    };

    const trendCtx = document.getElementById("healthTrendChart");
    if (trendCtx) {
      new Chart(trendCtx, {
        type: "line",
        data: {
          labels: months,
          datasets: [{
            label: "Avg Compliance Health",
            data: series,
            tension: 0.35,
            borderWidth: 3,
            pointRadius: 3
          }]
        },
        options: commonOptions
      });
    }

    const splitCtx = document.getElementById("clientSplitChart");
    if (splitCtx) {

        type: "doughnut",

        options: commonOptions

        options: commonOptions

}

                <th class="py-3 px-3">Type</th>
                <th class="py-3 px-3">Service</th>
                <th class="py-3 px-3">Assignee</th>

          </table>
        </div>
      </div>

    </div>
  `;

  const tbody = $("clientTableBody");

  function drawTable(type) {
    let filtered = [...pool];
    if (type !== "all") filtered = filtered.filter(c => c.type === type);

    tbody.innerHTML = filtered.map(c => `
      <tr class="border-b border-slate-100 dark:border-slate-700 table-row-hover">
        <td class="py-4 px-3 font-extrabold">${c.name}</td>
        <td class="py-4 px-3 uppercase text-xs font-bold text-blue-600">${c.type}</td>
        <td class="py-4 px-3 text-slate-500 font-medium">${c.service}</td>
        <td class="py-4 px-3 font-bold">${c.assignee}</td>
        <td class="py-4 px-3 font-bold text-purple-600">${c.joinDate || "-"}</td>

          <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-md"

            View

        </td>
      </tr>
    `).join("");

  drawTable("all");

  const slider = $("clientTabSlider");
  const tabBtns = document.querySelectorAll(".client-tab-btn");

  function activateTab(type) {
    tabBtns.forEach(btn => btn.classList.remove("active"));
    const activeBtn = document.querySelector(`.client-tab-btn[data-type="${type}"]`);
    if (activeBtn) activeBtn.classList.add("active");

    if (type === "all") slider.style.transform = "translateX(0%)";
    if (type === "factory") slider.style.transform = "translateX(100%)";
    if (type === "shop") slider.style.transform = "translateX(200%)";

    drawTable(type);
  }

  tabBtns.forEach(btn => {
    btn.onclick = () => activateTab(btn.dataset.type);
  });

  renderIcons();
}

function saveNewClient() {
  const name = $("newClientName").value.trim();
  const email = $("newClientEmail").value.trim();
  const type = $("newClientType").value;
  const service = $("newClientService").value.trim();
  const joinDate = $("newClientJoinDate").value;
  const assignee = $("newClientAssignee").value;

  if (!name || !email || !service || !joinDate) {
    alert("Please fill all fields.");
    return;
  }

  const exists = App.db.clients.find(c => c.email === email);
  if (exists) {
    alert("Client email already exists!");
    return;
  }

  const newClient = {
    id: Date.now(),
    name,
    email,
    type,
    service,
    joinDate,
    assignee,
    health: 80
  };

  App.db.clients.push(newClient);
  saveData("vcs_clients", App.db.clients);

  showToast("Client Added");
  pushNotification("New Client Added", `${name} added successfully`);

  closeAddClientModal();
  renderStaffClients();
}

        <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">Upload Tracker</h2>

          Tracks all uploaded compliance files.
        </p>

      <div class="chart-box">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-xs uppercase tracking-wider text-slate-500 border-b border-slate-200 dark:border-slate-700">
                <th class="py-3 px-3">Client</th>
                <th class="py-3 px-3">Document</th>
                <th class="py-3 px-3">Period</th>
                <th class="py-3 px-3">Status</th>
              </tr>
            </thead>
            <tbody id="uploadTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  `;

  const tbody = $("uploadTableBody");
  const uploadEntries = [];

  Object.keys(App.db.uploads).forEach(clientId => {
    Object.keys(App.db.uploads[clientId]).forEach(docKey => {
      uploadEntries.push({
        clientId,
        docKey,
        status: App.db.uploads[clientId][docKey].status
      });
    });
  });

  if (!uploadEntries.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="4" class="text-center py-10 text-slate-400 font-bold">
          No uploads tracked yet.
        </td>
      </tr>
    `;
    renderIcons();
    return;
  }

  tbody.innerHTML = uploadEntries.map(e => {
    const client = App.db.clients.find(c => c.id == e.clientId);
    const parsed = parseDocKey(e.docKey);

    return `
      <tr class="border-b border-slate-100 dark:border-slate-700 table-row-hover">
        <td class="py-4 px-3 font-extrabold">${client ? client.name : "Unknown"}</td>
        <td class="py-4 px-3 font-bold text-slate-600 dark:text-slate-200">${parsed.name}</td>
        <td class="py-4 px-3 font-extrabold text-blue-600">${parsed.period || "-"}</td>

          ${e.status}
        </td>
      </tr>
    `;
  }).join("");

  renderIcons();
}

function getActionForCategory(category) {
  if (App.state.role === "client") return "upload";
  const staffUpload = ["registers", "returns", "vcs_activities"];
  return staffUpload.includes(category) ? "upload" : "download";
}

function renderListItem(item, category) {
  const action = getActionForCategory(category);

  const recurring = ["registers", "returns", "vcs_activities"].includes(category);

  let docKey = item;
  let label = item;

  if (recurring) {
    docKey = makeDocKey(item);
    label = formatDocLabel(item);
  }

  return `
    <div class="p-3 border-b border-slate-100 dark:border-slate-700 last:border-0 flex items-center justify-between group hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors">
      <div class="flex items-center gap-3 cursor-pointer flex-1"
        onclick="openDocumentModal('${docKey.replaceAll("'", "")}', '${action}')">

        <div class="p-2 bg-blue-50 dark:bg-slate-700 rounded text-blue-600 group-hover:scale-110 transition-transform">
          <i data-lucide="${action === "upload" ? "upload-cloud" : "download-cloud"}" class="w-4 h-4"></i>
        </div>

        <p class="font-extrabold text-xs text-slate-700 dark:text-slate-200 leading-snug">${label}</p>
      </div>
    </div>
  `;
}

function renderAccordion(title, items, category) {
  if (!items || !items.length) return "";

  return `
    <div class="accordion-box border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden mb-4">
      <button onclick="toggleAccordion(this)"
        class="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">

        <span class="font-extrabold text-sm uppercase tracking-wide">${title}</span>
        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 accordion-icon"></i>
      </button>

      <div class="accordion-content bg-white dark:bg-slate-900/50">
        <div class="p-3">
          ${items.map(i => renderListItem(i, category)).join("")}
        </div>
      </div>
    </div>
  `;
}

function toggleAccordion(btn) {
  btn.closest(".accordion-box").classList.toggle("accordion-open");
}

          <button onclick="alert('Download simulated file')"

function closeDocumentModal() {
  $("document-modal").classList.add("hidden");
}

function simulateUpload() {
  const clientId = App.state.currentClientId;
  const docKey = App.state.openDocKey;

  if (!App.db.uploads[clientId]) App.db.uploads[clientId] = {};

  App.db.uploads[clientId][docKey] = {
    status: "Uploaded",
    time: new Date().toLocaleString()
  };

  saveData("vcs_uploads", App.db.uploads);

  showToast("Uploaded Successfully");
  pushNotification("Document Uploaded", docKey);
}

function showMessageInfo(time) {
  alert("Message Timestamp: " + time);
}

function editMessage(clientId, docKey, index) {
  const chats = App.db.docChat[clientId][docKey];
  if (!chats || !chats[index]) return;

  const newText = prompt("Edit Message:", chats[index].text);
  if (newText === null) return;
  if (!newText.trim()) return;

  chats[index].text = newText.trim();
  chats[index].edited = true;

  saveData("vcs_doc_chat", App.db.docChat);
  showToast("Message Edited");
  renderDocChat();
}

function renderDocChat() {
  const list = $("doc-chat-list");
  const clientId = App.state.currentClientId;
  const docKey = App.state.openDocKey;

  if (!App.db.docChat[clientId]) App.db.docChat[clientId] = {};
  if (!App.db.docChat[clientId][docKey]) App.db.docChat[clientId][docKey] = [];

  const chats = App.db.docChat[clientId][docKey];

  if (!chats.length) {
    list.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full text-slate-400">
        <i data-lucide="message-square-dashed" class="w-8 h-8 mb-2 opacity-50"></i>
        <p class="text-sm font-bold">No remarks for this document yet.</p>
      </div>
    `;
    renderIcons();
    return;
  }

  list.innerHTML = chats.map((m, idx) => `
    <div class="p-4 rounded-2xl ${m.role === App.state.role ? "bg-blue-100 dark:bg-blue-900/40" : "bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600"}">
      
      <div class="flex justify-between items-start gap-3">
        <p class="font-bold text-sm flex-1">
          ${m.text}
          ${m.edited ? `<span class="text-[10px] font-extrabold text-purple-600 ml-2">(Edited)</span>` : ""}
        </p>

        <div class="flex gap-2">
          <button onclick="showMessageInfo('${m.time}')"
            class="text-slate-400 hover:text-blue-600">
            <i data-lucide="info" class="w-4 h-4"></i>
          </button>

          <button onclick="editMessage(${clientId}, '${docKey.replaceAll("'", "")}', ${idx})"
            class="text-slate-400 hover:text-green-600">
            <i data-lucide="pencil" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <p class="text-[10px] text-slate-400 font-bold mt-2">${m.time}</p>
    </div>
  `).join("");

  setTimeout(() => list.scrollTop = list.scrollHeight, 50);
  renderIcons();
}

function sendDocRemark() {
  const input = $("doc-chat-input");
  const text = input.value.trim();
  if (!text) return;

  const clientId = App.state.currentClientId;
  const docKey = App.state.openDocKey;

  if (!App.db.docChat[clientId]) App.db.docChat[clientId] = {};
  if (!App.db.docChat[clientId][docKey]) App.db.docChat[clientId][docKey] = [];

  App.db.docChat[clientId][docKey].push({
    role: App.state.role,
    text,
    time: new Date().toLocaleString(),
    edited: false
  });

  saveData("vcs_doc_chat", App.db.docChat);

  input.value = "";
  showToast("Remark Sent");
  pushNotification("New Document Remark", docKey);

  renderDocChat();
}

function renderSearchResults(query) {
  query = query.trim().toLowerCase();

  const dropdown = $("search-dropdown");
  const list = $("search-results");

  if (!query) {
    dropdown.classList.add("hidden");
    return;
  }

  if (App.state.role === "staff") {
    const pool = getStaffClientsPool();
    const matches = pool.filter(c => c.name.toLowerCase().includes(query) || c.service.toLowerCase().includes(query));

    if (!matches.length) {
      dropdown.classList.add("hidden");
      return;
    }

    dropdown.classList.remove("hidden");

    list.innerHTML = matches.map(c => `
      <div onclick="openClientPanel(${c.id})"
        class="p-4 hover:bg-blue-50 dark:hover:bg-slate-700 cursor-pointer flex justify-between border-b border-slate-100 dark:border-slate-700 last:border-0 items-center transition-colors">
        <div>
          <p class="text-sm font-extrabold">${c.name}</p>
          <p class="text-[11px] text-slate-500 font-bold">${c.service}</p>
        </div>
        <span class="text-[10px] font-extrabold text-blue-600 bg-blue-100 dark:bg-blue-900/30 px-2 py-1 rounded uppercase">${c.type}</span>
      </div>
    `).join("");

  } else {
    dropdown.classList.add("hidden");
  }

  renderIcons();
}

function applyClientReturnFilter() {
  const type = $("clientReturnType") ? $("clientReturnType").value : "monthly";
  const month = $("clientMonthSelect") ? $("clientMonthSelect").value : App.state.filterMonth;
  const year = $("clientYearSelect") ? $("clientYearSelect").value : App.state.filterYear;

  App.state.filterMonth = month;
  App.state.filterYear = year;

  if (App.state.role === "client") {
    if (App.state.clientActivePage === "analytics") renderClientAnalyticsPage();
    else if (App.state.clientActivePage === "overview") renderClientOverviewPage();
    else renderClientOverviewPage();
  }

  showToast("Filter applied");
}

function renderClientAnalyticsPage() {
  const client = App.db.clients.find(c => c.id === App.state.currentClientId);

  App.state.clientActivePage = "analytics";

  const months = ["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];

  // Calculate uploaded/pending for current filters
  const compliance = App.db.compliance[client.type];
  const uploadsStore = (App.db.uploads && App.db.uploads[client.id]) ? App.db.uploads[client.id] : {};

  const expectedDocs = [
    ...compliance.registers,
    ...compliance.notices,
    ...compliance.onboarding,
    ...compliance.vcs_activities
  ];

  if (App.state.returnType === "monthly") expectedDocs.push(...compliance.returns.monthly);
  if (App.state.returnType === "quarterly") expectedDocs.push(...compliance.returns.quarterly);
  if (App.state.returnType === "halfYearly") expectedDocs.push(...compliance.returns.halfYearly);
  if (App.state.returnType === "annual") expectedDocs.push(...compliance.returns.annual);

  let uploaded = 0;
  let pending = 0;
  expectedDocs.forEach(doc => {
    const key = makeDocKey(doc);
    if (uploadsStore[key] && uploadsStore[key].fileName) uploaded++;
    else pending++;
  });

  const total = expectedDocs.length || 1;
  const completionPct = Math.round((uploaded / total) * 100);

  // Demo curve based on completion % (looks like staff analytics)
  const base = Math.max(20, completionPct - 18);
  const curve = months.map((m, i) => {
    const wave = Math.sin(i / 2.2) * 8;
    const drift = i * 2.2;

    return Math.max(0, Math.min(100, Math.round(base + wave + drift + rand)));

    App.state.email = email;

  App.state.role = "client";

function formatDDMMYYYY(dateObj) {
  const dd = String(dateObj.getDate()).padStart(2, "0");
  const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
  const yyyy = dateObj.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function formatTimeHHMM(dateObj) {
  const hh = String(dateObj.getHours()).padStart(2, "0");
  const mi = String(dateObj.getMinutes()).padStart(2, "0");
  return `${hh}:${mi}`;
}

function getDaysDiff(dateStrISO) {
  const now = new Date();
  const d = new Date(dateStrISO);
  const diffMs = d.setHours(0,0,0,0) - now.setHours(0,0,0,0);
  return Math.round(diffMs / (1000 * 60 * 60 * 24));
}

function getDeadlineTemplateByType(clientType) {
  // Based on your compliance model
  const baseMonthly = [
    { title: "PF Filing", day: 15, category: "Monthly" },
    { title: "ESI Filing", day: 15, category: "Monthly" },
    { title: "PT Filing", day: 20, category: "Monthly" }
  ];

  const quarterly = [
    { title: "Employment Exchange Return (ER-1)", monthList: [6, 9, 12, 3], day: 10, category: "Quarterly" }
  ];

  const halfYearly = [
    { title: "Half Yearly Return (Form 21)", monthList: [7, 1], day: 15, category: "Half-Yearly" }
  ];

  const annual = [
    { title: "Annual Return Submission", monthList: [1], day: 31, category: "Annual" }
  ];

  // You can add type-specific deadlines here later
  return { baseMonthly, quarterly, halfYearly, annual };
}

function getSelectedClientForCalendarScope() {
  if (App.state.role === "client") {
    return App.db.clients.find(c => c.id === App.state.currentClientId);
  }
  return null;
}

function getCalendarScopeClients() {
  // Staff sees assigned clients, client sees self
  if (App.state.role === "client") {
    const c = getSelectedClientForCalendarScope();
    return c ? [c] : [];
  }

  if (App.state.role === "staff") {
    if (App.state.staffName === "Vishaal") return [...App.db.clients];
    return App.db.clients.filter(c => c.assignee === App.state.staffName);
  }

  return [];
}

function buildDeadlinesForMonth(year, monthIndex1to12) {
  const clients = getCalendarScopeClients();
  const list = [];

  clients.forEach(client => {
    const tpl = getDeadlineTemplateByType(client.type);

    // Monthly deadlines
    tpl.baseMonthly.forEach(d => {
      const dt = new Date(year, monthIndex1to12 - 1, d.day);
      list.push({
        id: `${client.id}_${year}_${monthIndex1to12}_${d.title}`,
        clientId: client.id,
        clientName: client.name,
        title: d.title,
        category: d.category,
        dateISO: dt.toISOString().slice(0,10)
      });
    });

    // Quarterly deadlines
    tpl.quarterly.forEach(q => {
      if (q.monthList.includes(monthIndex1to12)) {
        const dt = new Date(year, monthIndex1to12 - 1, q.day);
        list.push({
          id: `${client.id}_${year}_${monthIndex1to12}_${q.title}`,
          clientId: client.id,
          clientName: client.name,
          title: q.title,
          category: q.category,
          dateISO: dt.toISOString().slice(0,10)
        });
      }
    });

    // Half-yearly
    tpl.halfYearly.forEach(h => {
      if (h.monthList.includes(monthIndex1to12)) {
        const dt = new Date(year, monthIndex1to12 - 1, h.day);
        list.push({
          id: `${client.id}_${year}_${monthIndex1to12}_${h.title}`,
          clientId: client.id,
          clientName: client.name,
          title: h.title,
          category: h.category,
          dateISO: dt.toISOString().slice(0,10)
        });
      }
    });

    // Annual
    tpl.annual.forEach(a => {
      if (a.monthList.includes(monthIndex1to12)) {
        const dt = new Date(year, monthIndex1to12 - 1, a.day);
        list.push({
          id: `${client.id}_${year}_${monthIndex1to12}_${a.title}`,
          clientId: client.id,
          clientName: client.name,
          title: a.title,
          category: a.category,
          dateISO: dt.toISOString().slice(0,10)
        });
      }
    });

  });

  return list.sort((a,b) => a.dateISO.localeCompare(b.dateISO));
}

                <th class="py-3 px-3">Category</th>
                <th class="py-3 px-3">Status</th>
                <th class="py-3 px-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="deadlineTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  `;

  const body = document.getElementById("deadlineTableBody");

  if (!deadlines.length) {
    body.innerHTML = `
      <tr>
        <td colspan="6" class="py-10 text-center text-slate-400 font-bold">No deadlines found.</td>
      </tr>
    `;
  } else {
    body.innerHTML = deadlines.map(d => {
      const days = getDaysDiff(d.dateISO);
      const done = isDeadlineDone(d.id);

      let statusLabel = "Upcoming";
      let statusColor = "text-blue-600";
      if (done) {
        statusLabel = "Completed";
        statusColor = "text-green-600";
      } else if (days < 0) {
        statusLabel = "Overdue";
        statusColor = "text-red-600";
      } else if (days <= 3) {
        statusLabel = "Due Soon";
        statusColor = "text-amber-600";
      }

      return `
        <tr class="border-b border-slate-100 dark:border-slate-700 table-row-hover">
          <td class="py-4 px-3 font-extrabold text-purple-600">${d.dateISO.split("-").reverse().join("/")}</td>
          <td class="py-4 px-3 font-extrabold">${d.title}</td>
          <td class="py-4 px-3 font-bold text-slate-600 dark:text-slate-200">${d.clientName}</td>
          <td class="py-4 px-3 font-extrabold text-slate-500">${d.category}</td>
          <td class="py-4 px-3 font-extrabold ${statusColor}">${statusLabel}</td>
          <td class="py-4 px-3 text-right space-x-2">
            <button class="bg-slate-900 dark:bg-slate-700 text-white px-3 py-2 rounded-xl font-bold text-xs"
              onclick="openReminderModal({title:'${d.title.replace(/'/g,"\\'")}', dateISO:'${d.dateISO}', time:'10:00'})">
              Remind
            </button>
            <button class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-xl font-bold text-xs"
              onclick="toggleDeadlineDone('${d.id}'); renderCalendarPage();">
              ${done ? "Undo" : "Done"}
            </button>
          </td>
        </tr>
      `;
    }).join("");
  }

  // Bind selectors
  const mSel = document.getElementById("calMonthSelect");
  const ySel = document.getElementById("calYearSelect");

  mSel.value = String(month).padStart(2,"0");
  ySel.value = String(year);

  mSel.onchange = () => {
    App.state.filterMonth = mSel.value;
    renderCalendarPage();
  };

  ySel.onchange = () => {
    App.state.filterYear = ySel.value;
    renderCalendarPage();
  };

  renderIcons();
}

function renderRemindersPage() {
  const scopeClients = getCalendarScopeClients();

  $("main-content").innerHTML = `
    <div class="max-w-[1500px] mx-auto space-y-8 pb-12 fade-in">

      <div class="flex items-center justify-between flex-wrap gap-4">
        <div>
          <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">Reminders</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">
            Create reminders for deadlines, uploads, and compliance tasks.
          </p>
        </div>

        <button onclick="openReminderModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg btn-pop transition-transform">
          + Add Reminder
        </button>
      </div>

      <div class="chart-box">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-xs uppercase tracking-wider text-slate-500 border-b border-slate-200 dark:border-slate-700">
                <th class="py-3 px-3">Reminder</th>
                <th class="py-3 px-3">Client</th>
                <th class="py-3 px-3">Date</th>
                <th class="py-3 px-3">Time</th>
                <th class="py-3 px-3">Status</th>
                <th class="py-3 px-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="remindersTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  `;

  const body = document.getElementById("remindersTableBody");

  if (!App.db.reminders.length) {
    body.innerHTML = `
      <tr>
        <td colspan="6" class="py-10 text-center text-slate-400 font-bold">No reminders created yet.</td>
      </tr>
    `;
    return;
  }

  body.innerHTML = App.db.reminders.map(r => {
    const client = r.clientId ? scopeClients.find(c => c.id === r.clientId) : null;
    const days = getDaysDiff(r.date);
    let status = r.done ? "Done" : "Pending";
    let color = r.done ? "text-green-600" : (days < 0 ? "text-red-600" : (days <= 2 ? "text-amber-600" : "text-blue-600"));

    return `
      <tr class="border-b border-slate-100 dark:border-slate-700 table-row-hover">
        <td class="py-4 px-3 font-extrabold">${r.title}</td>
        <td class="py-4 px-3 font-bold text-slate-600 dark:text-slate-200">${client ? client.name : "General"}</td>
        <td class="py-4 px-3 font-extrabold text-purple-600">${r.date.split("-").reverse().join("/")}</td>
        <td class="py-4 px-3 font-extrabold text-slate-700 dark:text-white">${r.time}</td>
        <td class="py-4 px-3 font-extrabold ${color}">${status}</td>
        <td class="py-4 px-3 text-right space-x-2">
          <button class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-xl font-bold text-xs"
            onclick="rMarkDone(${r.id})">
            ${r.done ? "Undo" : "Done"}
          </button>
          <button class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl font-bold text-xs"
            onclick="rDelete(${r.id})">
            Delete
          </button>
        </td>
      </tr>
    `;
  }).join("");
}

function rMarkDone(id) {
  const r = App.db.reminders.find(x => x.id === id);
  if (!r) return;
  r.done = !r.done;
  saveReminders();
  showToast(r.done ? "Reminder Completed" : "Reminder Reopened");
  renderRemindersPage();
  renderNotifications();
}

function rDelete(id) {
  App.db.reminders = App.db.reminders.filter(x => x.id !== id);
  saveReminders();
  showToast("Reminder Deleted");
  renderRemindersPage();
  renderNotifications();
}

function pushAutoReminderNotifications() {
  // Adds a notification for reminders due soon (within 1 day) - demo
  const soon = App.db.reminders.filter(r => !r.done && getDaysDiff(r.date) <= 1 && getDaysDiff(r.date) >= 0);
  if (!soon.length) return;

  // Do not spam - only once per session
  if (sessionStorage.getItem("vcs_auto_reminders_pushed")) return;
  sessionStorage.setItem("vcs_auto_reminders_pushed", "1");

  soon.slice(0, 3).forEach(r => {
    pushNotification("Reminder Due Soon", `${r.title} at ${r.time} (${r.date.split("-").reverse().join("/")})`);
  });
}

/* =========================
   CHAT ENGINE (DOC REMARKS)
========================= */

function formatDateTime(ts) {
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yyyy = d.getFullYear();
  let hh = d.getHours();
  const min = String(d.getMinutes()).padStart(2, "0");
  const ampm = hh >= 12 ? "PM" : "AM";
  hh = hh % 12; if (hh === 0) hh = 12;
  const hhs = String(hh).padStart(2, "0");
  return `${dd}/${mm}/${yyyy}, ${hhs}:${min} ${ampm}`;
}

function getDocChatKey() {
  const key = App.state.openDocKey || "unknown_doc";
  return key;
}

function ensureDocChatStore() {
  if (!App.db.docChat) App.db.docChat = {};
  const k = getDocChatKey();
  if (!App.db.docChat[k]) App.db.docChat[k] = [];
  return App.db.docChat[k];
}

function renderDocChat() {
  const list = $("doc-chat-list");
  if (!list) return;

  const msgs = ensureDocChatStore();

  if (!msgs.length) {
    list.innerHTML = `<div class="text-center text-slate-400 text-xs font-bold py-10">No remarks yet</div>`;
    return;
  }

  list.innerHTML = msgs.map(m => {
    const editedTag = m.edited ? `<span class="chat-edited-pill" onclick="toggleEditedPreview('${m.id}')">edited</span>` : ``;

    return `
      <div class="chat-bubble ${m.sender === App.state.email ? "me" : "other"}" data-msg="${m.id}">
        <div class="font-extrabold">${escapeHtml(m.text)}</div>

        ${m.edited ? `<div id="oldPreview_${m.id}" class="chat-old-preview hidden">
          <div class="text-[10px] font-black uppercase opacity-70 mb-1">Previous</div>
          ${escapeHtml(m.oldText || "")}
        </div>` : ""}

        <div class="chat-meta flex items-center justify-between gap-3">
          <span>${formatDateTime(m.time)}</span>
          ${editedTag}
        </div>

        ${m.sender === App.state.email ? `
          <div class="chat-actions">
            <div class="relative">
              <button class="chat-dot-btn" onclick="toggleMsgMenu('${m.id}')">
                <svg viewBox="0 0 24 24" width="18" height="18" style="stroke:none;fill:currentColor;opacity:0.75">
                  <circle cx="5" cy="12" r="2"></circle>
                  <circle cx="12" cy="12" r="2"></circle>
                  <circle cx="19" cy="12" r="2"></circle>
                </svg>
              </button>

              <div id="menu_${m.id}" class="chat-menu">
                <button onclick="showMsgInfo('${m.id}')">
                  <i data-lucide="info" class="w-4 h-4"></i>
                  Info
                </button>
                <button onclick="editMsg('${m.id}')">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                  Edit
                </button>
              </div>
            </div>
          </div>
        ` : ""}
      </div>
    `;
  }).join("");

  renderIcons();
}

function toggleEditedPreview(id) {
  const el = document.getElementById("oldPreview_" + id);
  if (!el) return;
  el.classList.toggle("hidden");
}

function toggleMsgMenu(id) {
  document.querySelectorAll(".chat-menu").forEach(m => {
    if (m.id !== "menu_" + id) m.style.display = "none";
  });

  const menu = document.getElementById("menu_" + id);
  if (!menu) return;
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

function showMsgInfo(id) {
  const msgs = ensureDocChatStore();
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  alert(`Message Info\n\nDate & Time: ${formatDateTime(m.time)}\nEdited: ${m.edited ? "Yes" : "No"}`);
  toggleMsgMenu(id);
}

function editMsg(id) {
  const msgs = ensureDocChatStore();
  const m = msgs.find(x => x.id === id);
  if (!m) return;

  const newText = prompt("Edit your message:", m.text);
  if (newText === null) return;
  const trimmed = newText.trim();
  if (!trimmed) return;

  if (trimmed !== m.text) {
    m.oldText = m.text;
    m.text = trimmed;
    m.edited = true;
    m.editTime = Date.now();
    saveData("vcs_doc_chat", App.db.docChat);
    renderDocChat();
    showToast("Message Edited");
  }

  toggleMsgMenu(id);
}

function bindDocChatControls() {
  const sendBtn = $("docSendBtn");
  const cancelBtn = $("docCancelBtn");
  const input = $("doc-chat-input");

  if (cancelBtn) {
    cancelBtn.onclick = () => {
      if (input) input.value = "";
      showToast("Cleared");
    };
  }

  if (sendBtn && input) {
    sendBtn.onclick = () => {
      const text = input.value.trim();
      if (!text) return;

      const msgs = ensureDocChatStore();
      msgs.push({
        id: "m_" + Date.now(),
        sender: App.state.email || "unknown",
        text,
        time: Date.now(),
        edited: false,
        oldText: ""
      });

      saveData("vcs_doc_chat", App.db.docChat);

      input.value = "";
      renderDocChat();
      showToast("Remark Sent");

      setTimeout(() => {
        const list = $("doc-chat-list");
        if (list) list.scrollTop = list.scrollHeight;
      }, 30);
    };

    input.onkeydown = (e) => {
      if (e.key === "Enter") sendBtn.click();
    };
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".chat-actions")) {
      document.querySelectorAll(".chat-menu").forEach(m => m.style.display = "none");
    }
  });
}

/* Basic XSS safe text */
function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function renderDeadlineTimeline(items) {
  if (!items || !items.length) {
    return `<div class="p-6 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-center text-xs font-bold text-slate-400">
      No deadlines found
    </div>`;
  }

  return `
    <div class="space-y-4">
      ${items.map(d => {
        const statusColor = d.status === "Overdue" ? "bg-red-600" : d.status === "Upcoming" ? "bg-amber-500" : "bg-green-600";
        const badgeColor = d.status === "Overdue" ? "text-red-600 bg-red-50 dark:bg-red-900/20 border-red-100 dark:border-red-800" :
                           d.status === "Upcoming" ? "text-amber-700 bg-amber-50 dark:bg-amber-900/20 border-amber-100 dark:border-amber-800" :
                           "text-green-700 bg-green-50 dark:bg-green-900/20 border-green-100 dark:border-green-800";

        return `
          <div class="flex gap-4">
            <div class="flex flex-col items-center">
              <div class="timeline-dot ${statusColor} shadow"></div>
              <div class="timeline-line"></div>
            </div>

            <div class="flex-1 p-5 rounded-2xl bg-white/80 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-700 shadow-sm glass-pop">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <p class="text-sm font-extrabold text-slate-900 dark:text-white">${d.title}</p>
                  <p class="text-xs font-bold text-slate-500 mt-1">${d.client}</p>
                  <p class="text-[11px] font-bold text-slate-400 mt-2">Due: ${d.due}</p>
                </div>
                <span class="px-3 py-1 rounded-full text-[11px] font-extrabold border ${badgeColor}">
                  ${d.status}
                </span>
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}
